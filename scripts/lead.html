<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FindProperty — Leads</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root {
  --font-family: 'Poppins', sans-serif;
  --color-primary: #D4A843;
  --color-primary-hover: #C8992F;
  --color-primary-bg: #F8F3E8;
  --color-bg: #FAFAFA;
  --color-surface: #FFFFFF;
  --color-text: #2F2F2F;
  --color-text-secondary: #707070;
  --color-text-muted: #A5A5A5;
  --color-border: #ECECEC;
  --color-border-light: #F3F3F3;
  --color-success: #30C46C;
  --color-info: #4E9EF7;
  --color-warning: #E7B64A;
  --color-danger: #E15D5D;
  --color-success-bg: #ECFAF2;
  --color-info-bg: #EDF5FF;
  --color-warning-bg: #FFF7E8;
  --radius-sm: 8px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 20px;
  --radius-full: 999px;
  --shadow-sm: 0 2px 10px rgba(0,0,0,.04);
  --shadow-md: 0 6px 20px rgba(0,0,0,.05);
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px;
  --transition: 200ms ease;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body {
  font-family: var(--font-family);
  background: var(--color-bg);
  color: var(--color-text);
  padding: var(--space-5) var(--space-6);
  max-width: 1200px;
  margin: 0 auto;
}

/* Nav */
.nav { display: flex; gap: var(--space-1); margin-bottom: var(--space-5); border-bottom: 2px solid var(--color-border); padding-bottom: 0; }
.nav a {
  display: inline-flex; align-items: center; gap: var(--space-2);
  padding: var(--space-3) var(--space-5);
  text-decoration: none; font-weight: 500; font-size: 0.9rem;
  color: var(--color-text-secondary);
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: all var(--transition);
}
.nav a.active { color: var(--color-primary); border-bottom-color: var(--color-primary); }
.nav a:hover:not(.active) { color: var(--color-text); }

.page-title {
  font-size: 1.5rem; font-weight: 700;
  display: flex; align-items: center; gap: var(--space-3);
  margin-bottom: var(--space-6);
}
.page-title span { color: var(--color-primary); }

/* Stats */
.stats { display: flex; gap: var(--space-4); flex-wrap: wrap; margin-bottom: var(--space-6); }
.stat-card {
  flex: 1; min-width: 100px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
  text-align: center;
  box-shadow: var(--shadow-sm);
}
.stat-card .num { font-size: 1.4rem; font-weight: 700; display: block; }
.stat-card .label { font-size: 0.72rem; color: var(--color-text-secondary); }
.stat-card.total .num { color: var(--color-text); }
.stat-card.new .num { color: var(--color-info); }
.stat-card.contacted .num { color: var(--color-warning); }
.stat-card.appointment .num { color: var(--color-success); }
.stat-card.sold .num { color: var(--color-danger); }

/* Filters */
.filters {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-4) var(--space-5);
  margin-bottom: var(--space-5);
  box-shadow: var(--shadow-sm);
}
.filter-grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
  gap: var(--space-3);
  align-items: end;
}
.filter-grid .field { display: flex; flex-direction: column; gap: var(--space-1); }
.filter-grid .field label { font-size: 0.72rem; font-weight: 500; color: var(--color-text-secondary); }
.filter-actions { display: flex; gap: var(--space-2); align-items: flex-end; }
.filter-toggle {
  display: none;
  width: 100%;
  padding: var(--space-2);
  background: none; border: 1px dashed var(--color-border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-family: var(--font-family); font-size: 0.82rem;
  color: var(--color-text-secondary);
  margin-bottom: var(--space-3);
  text-align: center;
}
.filter-toggle:hover { background: var(--color-bg); }

/* Actions bar */
.actions-bar {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: var(--space-3);
  margin-bottom: var(--space-4);
}
.actions-bar .left { display: flex; align-items: center; gap: var(--space-3); }
.actions-bar .right { display: flex; gap: var(--space-2); }
.result-count { font-size: 0.85rem; color: var(--color-text-secondary); }

/* Lead Grid */
.lead-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-4);
  margin-bottom: var(--space-6);
}

.lead-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: box-shadow var(--transition);
  display: flex;
  flex-direction: column;
}
.lead-card:hover { box-shadow: var(--shadow-md); }

.lead-card-inner { display: flex; flex: 1; }
.lead-thumb {
  width: 140px; min-height: 120px;
  flex-shrink: 0;
  background: var(--color-border-light);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.lead-thumb img { width: 100%; height: 100%; object-fit: cover; }
.lead-thumb .no-img { color: var(--color-text-muted); }

.lead-body { flex: 1; padding: var(--space-3) var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); }
.lead-head { display: flex; align-items: flex-start; gap: var(--space-2); flex-wrap: wrap; }
.lead-type {
  font-size: 0.82rem; font-weight: 600; color: var(--color-text);
  background: var(--color-primary-bg);
  padding: 2px 10px; border-radius: var(--radius-full);
}
.lead-price {
  font-size: 1rem; font-weight: 700; color: var(--color-danger);
}
.lead-price i { color: var(--color-danger); width: 14px; height: 14px; vertical-align: middle; }
.lead-location { font-size: 0.82rem; color: var(--color-text-secondary); display: flex; align-items: center; gap: var(--space-1); }
.lead-contact { font-size: 0.82rem; color: var(--color-text-secondary); display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.lead-contact a { color: var(--color-info); text-decoration: none; }
.lead-contact a:hover { text-decoration: underline; }
.lead-conf {
  display: flex; align-items: center; gap: var(--space-2);
}
.conf-bar {
  flex: 1; height: 6px; background: var(--color-border-light);
  border-radius: var(--radius-full); overflow: hidden;
}
.conf-bar-fill { height: 100%; border-radius: var(--radius-full); transition: width 0.3s; }
.conf-bar-fill.high { background: var(--color-success); }
.conf-bar-fill.med { background: var(--color-warning); }
.conf-bar-fill.low { background: var(--color-danger); }
.conf-text { font-size: 0.72rem; color: var(--color-text-muted); white-space: nowrap; }

.lead-footer {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: var(--space-2);
  margin-top: auto;
  border-top: 1px solid var(--color-border-light);
  padding-top: var(--space-2);
}
.lead-date { font-size: 0.72rem; color: var(--color-text-muted); display: flex; align-items: center; gap: var(--space-1); }
.lead-actions { display: flex; gap: var(--space-1); }

/* Badge */
.badge {
  display: inline-flex; align-items: center; gap: var(--space-1);
  padding: 2px 10px; border-radius: var(--radius-full);
  font-size: 0.72rem; font-weight: 600; line-height: 1.5;
}
.badge-new { background: var(--color-info-bg); color: var(--color-info); }
.badge-contacted { background: var(--color-warning-bg); color: #92400e; }
.badge-interested { background: var(--color-success-bg); color: var(--color-success); }
.badge-not_interested { background: #FEF2F2; color: var(--color-danger); }
.badge-appointment { background: #E8F5E9; color: #2E7D32; }
.badge-sold { background: #FCE4EC; color: #C62828; }
.badge-rented { background: #E0F7FA; color: #00695C; }
.badge-invalid { background: #F5F5F5; color: #9E9E9E; }

.badge-clickable { cursor: pointer; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: var(--space-2);
  height: 38px; padding: 0 var(--space-4);
  border-radius: var(--radius-md);
  font-family: var(--font-family); font-size: 0.85rem; font-weight: 600;
  border: 1px solid transparent; cursor: pointer;
  transition: all var(--transition); white-space: nowrap; text-decoration: none;
  line-height: 1;
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--color-primary); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--color-primary-hover); }
.btn-secondary { background: var(--color-surface); color: var(--color-text-secondary); border-color: var(--color-border); }
.btn-secondary:hover:not(:disabled) { background: #FAFAFA; color: var(--color-text); }
.btn-ghost { background: transparent; color: var(--color-text-secondary); padding: 0 var(--space-2); height: 34px; }
.btn-ghost:hover:not(:disabled) { background: #F5F5F5; }
.btn-sm { height: 34px; padding: 0 var(--space-3); font-size: 0.82rem; }
.btn-xs { height: 28px; padding: 0 var(--space-2); font-size: 0.75rem; }

/* Inputs */
.input {
  height: 38px; padding: 0 var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  font-family: var(--font-family); font-size: 0.82rem;
  color: var(--color-text); background: var(--color-surface);
  transition: all var(--transition); outline: none;
  width: 100%;
}
.input:focus { border-color: var(--color-primary); box-shadow: 0 0 0 4px rgba(212,168,67,.15); }
.input::placeholder { color: var(--color-text-muted); }
select.input { cursor: pointer; }

/* Pagination */
.pagination {
  display: flex; align-items: center; justify-content: center;
  gap: var(--space-2); flex-wrap: wrap;
  margin-bottom: var(--space-8);
}
.page-btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 36px; height: 36px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-surface);
  font-family: var(--font-family); font-size: 0.82rem; font-weight: 500;
  color: var(--color-text-secondary); cursor: pointer;
  transition: all var(--transition);
}
.page-btn:hover:not(.active):not(:disabled) { background: var(--color-bg); }
.page-btn.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
.page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* Modal */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,.4);
  z-index: 1000;
  align-items: center; justify-content: center;
  padding: var(--space-4);
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--color-surface);
  border-radius: var(--radius-xl);
  max-width: 560px; width: 100%;
  max-height: 80vh; overflow-y: auto;
  padding: var(--space-6);
  box-shadow: 0 20px 60px rgba(0,0,0,.15);
  position: relative;
}
.modal-close {
  position: absolute; top: var(--space-3); right: var(--space-3);
  background: none; border: none; cursor: pointer;
  color: var(--color-text-muted); padding: var(--space-1);
  border-radius: var(--radius-sm);
}
.modal-close:hover { background: var(--color-bg); color: var(--color-text); }
.modal h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: var(--space-4); }
.modal textarea {
  width: 100%; min-height: 160px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-3);
  font-family: var(--font-family); font-size: 0.85rem;
  color: var(--color-text); resize: vertical;
  outline: none;
}
.modal textarea:focus { border-color: var(--color-primary); }
.copy-btn {
  display: inline-flex; align-items: center; gap: var(--space-2);
  margin-top: var(--space-3);
  padding: var(--space-2) var(--space-4);
  border-radius: var(--radius-md);
  background: var(--color-primary); color: #fff;
  border: none; font-family: var(--font-family); font-size: 0.85rem; font-weight: 600;
  cursor: pointer; transition: background var(--transition);
}
.copy-btn:hover { background: var(--color-primary-hover); }
.copy-btn.copied { background: var(--color-success); }

/* Detail modal */
.detail-section { margin-bottom: var(--space-4); }
.detail-section h3 { font-size: 0.85rem; font-weight: 600; color: var(--color-primary); margin-bottom: var(--space-2); text-transform: uppercase; letter-spacing: 0.5px; }
.detail-row { display: flex; gap: var(--space-2); padding: 3px 0; font-size: 0.85rem; }
.detail-row .lbl { color: var(--color-text-secondary); min-width: 90px; flex-shrink: 0; }
.detail-row .val { color: var(--color-text); word-break: break-all; }
.detail-imgs { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.detail-imgs img { width: 100px; height: 75px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--color-border); cursor: pointer; }

/* Toast */
.toast {
  position: fixed; bottom: var(--space-6); left: 50%; transform: translateX(-50%);
  background: var(--color-text); color: #fff;
  padding: var(--space-3) var(--space-6);
  border-radius: var(--radius-full);
  font-size: 0.85rem; font-weight: 500;
  z-index: 2000;
  opacity: 0; transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

/* Empty */
.empty-state { text-align: center; padding: var(--space-10) var(--space-4); color: var(--color-text-muted); font-size: 0.9rem; }
.loading { color: var(--color-text-muted); font-size: 0.85rem; padding: var(--space-8) 0; text-align: center; }

/* Mobile */
@media (max-width: 900px) {
  .lead-grid { grid-template-columns: 1fr; }
  .filter-grid {
    grid-template-columns: 1fr 1fr;
  }
  .filter-grid .filter-actions { grid-column: 1 / -1; }
  .filter-toggle { display: block; }
  .filter-grid.collapsed { display: none; }
}
@media (max-width: 600px) {
  body { padding: var(--space-3); }
  .filter-grid { grid-template-columns: 1fr; }
  .lead-thumb { width: 100px; }
  .stats { gap: var(--space-2); }
  .stat-card { min-width: 70px; padding: var(--space-2); }
  .stat-card .num { font-size: 1.1rem; }
  .actions-bar .left, .actions-bar .right { width: 100%; }
  .actions-bar { flex-direction: column; align-items: stretch; }
}
</style>
</head>
<body>

<!-- Nav -->
<div class="nav">
  <a href="/"><i data-lucide="settings-2" style="width:16px;height:16px"></i> Config</a>
  <a href="/lead" class="active"><i data-lucide="users" style="width:16px;height:16px"></i> Leads</a>
</div>

<!-- Title -->
<h1 class="page-title">
  <i data-lucide="users" style="width:24px;height:24px;color:var(--color-primary)"></i>
  Find<span>Property</span> — Leads
</h1>

<!-- Stats -->
<div class="stats" id="statsBar"><div class="loading">กำลังโหลดสถิติ...</div></div>

<!-- Filters -->
<div class="filters">
  <button class="filter-toggle" id="filterToggle" onclick="toggleFilters()">
    <i data-lucide="sliders-horizontal" style="width:14px;height:14px"></i> ตัวกรอง
  </button>
  <div class="filter-grid" id="filterGrid">
    <div class="field">
      <label>ค้นหา</label>
      <input class="input" type="text" id="fSearch" placeholder="ชื่อ, ข้อความ, เบอร์, LINE..." />
    </div>
    <div class="field">
      <label>สถานะ</label>
      <select class="input" id="fStatus">
        <option value="">ทั้งหมด</option>
        <option value="new">ใหม่</option>
        <option value="contacted">ติดต่อแล้ว</option>
        <option value="interested">สนใจ</option>
        <option value="not_interested">ไม่สนใจ</option>
        <option value="appointment">นัดดู</option>
        <option value="sold">ขายแล้ว</option>
        <option value="rented">เช่าแล้ว</option>
        <option value="invalid">ไม่ถูกต้อง</option>
      </select>
    </div>
    <div class="field">
      <label>ประเภท</label>
      <select class="input" id="fType">
        <option value="">ทั้งหมด</option>
        <option value="บ้านเดี่ยว">บ้านเดี่ยว</option>
        <option value="ทาวน์เฮ้าส์">ทาวน์เฮ้าส์</option>
        <option value="คอนโด">คอนโด</option>
        <option value="ที่ดิน">ที่ดิน</option>
        <option value="อาคารพาณิชย์">อาคารพาณิชย์</option>
        <option value="อพาร์ทเม้นท์">อพาร์ทเม้นท์</option>
        <option value="อาคาร">อาคาร</option>
        <option value="อื่นๆ">อื่นๆ</option>
      </select>
    </div>
    <div class="field">
      <label>จังหวัด</label>
      <input class="input" type="text" id="fProvince" placeholder="เช่น กรุงเทพฯ" />
    </div>
    <div class="field filter-actions" style="align-items:flex-end">
      <button class="btn btn-primary btn-sm" onclick="applyFilters()"><i data-lucide="search" style="width:14px;height:14px"></i> ค้นหา</button>
      <button class="btn btn-secondary btn-sm" onclick="resetFilters()"><i data-lucide="x" style="width:14px;height:14px"></i> ล้าง</button>
    </div>
  </div>
</div>

<!-- Actions bar -->
<div class="actions-bar">
  <div class="left">
    <span class="result-count" id="resultCount"></span>
  </div>
  <div class="right">
    <button class="btn btn-secondary btn-sm" onclick="exportCSV()">
      <i data-lucide="download" style="width:14px;height:14px"></i> Export CSV
    </button>
  </div>
</div>

<!-- Lead Grid -->
<div id="leadGrid"><div class="loading">กำลังโหลดข้อมูล...</div></div>

<!-- Pagination -->
<div class="pagination" id="pagination"></div>

<!-- Share Modal -->
<div class="modal-overlay" id="shareModal">
  <div class="modal">
    <button class="modal-close" onclick="closeShareModal()"><i data-lucide="x" style="width:20px;height:20px"></i></button>
    <h2><i data-lucide="share-2" style="width:18px;height:18px;vertical-align:middle"></i> แชร์ประกาศ</h2>
    <textarea id="shareText" readonly></textarea>
    <button class="copy-btn" id="copyBtn" onclick="copyShareText()">
      <i data-lucide="copy" style="width:16px;height:16px"></i> คัดลอกข้อความ
    </button>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <button class="modal-close" onclick="closeDetailModal()"><i data-lucide="x" style="width:20px;height:20px"></i></button>
    <h2 id="detailTitle">รายละเอียด</h2>
    <div id="detailBody"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const API_BASE = '';

const STATUS_MAP = {
  new: 'ใหม่', contacted: 'ติดต่อแล้ว', interested: 'สนใจ',
  not_interested: 'ไม่สนใจ', appointment: 'นัดดู',
  sold: 'ขายแล้ว', rented: 'เช่าแล้ว', invalid: 'ไม่ถูกต้อง',
};

let currentState = { page: 1 };

window.onload = function () {
  lucide.createIcons();
  loadLeads();
  loadStats();
};

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function toggleFilters() {
  const g = document.getElementById('filterGrid');
  g.classList.toggle('collapsed');
  const btn = document.getElementById('filterToggle');
  if (g.classList.contains('collapsed')) {
    btn.innerHTML = '<i data-lucide="sliders-horizontal" style="width:14px;height:14px"></i> ตัวกรอง';
  } else {
    btn.innerHTML = '<i data-lucide="sliders-horizontal" style="width:14px;height:14px"></i> ซ่อนตัวกรอง';
  }
  lucide.createIcons();
}

function getFilters() {
  return {
    search: document.getElementById('fSearch').value.trim(),
    status: document.getElementById('fStatus').value,
    property_type: document.getElementById('fType').value,
    province: document.getElementById('fProvince').value.trim(),
  };
}

function getFilterParams() {
  const f = getFilters();
  const p = new URLSearchParams();
  if (f.search) p.set('search', f.search);
  if (f.status) p.set('status', f.status);
  if (f.property_type) p.set('property_type', f.property_type);
  if (f.province) p.set('province', f.province);
  p.set('page', String(currentState.page));
  p.set('limit', '20');
  return p;
}

function applyFilters() {
  currentState.page = 1;
  loadLeads();
}

function resetFilters() {
  document.getElementById('fSearch').value = '';
  document.getElementById('fStatus').value = '';
  document.getElementById('fType').value = '';
  document.getElementById('fProvince').value = '';
  currentState.page = 1;
  loadLeads();
}

async function loadStats() {
  try {
    const res = await fetch(API_BASE + '/api/leads?limit=1');
    const data = await res.json();
    const total = data.total || 0;

    const statusRes = await fetch(API_BASE + '/api/leads?limit=1000');
    const statusData = await statusRes.json();
    const leads = statusData.leads || [];

    const counts = { new: 0, contacted: 0, appointment: 0, sold: 0, rented: 0, interested: 0, not_interested: 0, invalid: 0 };
    for (const l of leads) {
      const s = l.lead_status || 'new';
      counts[s] = (counts[s] || 0) + 1;
    }

    document.getElementById('statsBar').innerHTML = `
      <div class="stat-card total"><span class="num">${total}</span><span class="label">ทั้งหมด</span></div>
      <div class="stat-card new"><span class="num">${counts.new}</span><span class="label">ใหม่</span></div>
      <div class="stat-card contacted"><span class="num">${counts.contacted + counts.interested + counts.not_interested}</span><span class="label">ติดต่อแล้ว</span></div>
      <div class="stat-card appointment"><span class="num">${counts.appointment}</span><span class="label">นัดดู</span></div>
      <div class="stat-card sold"><span class="num">${counts.sold + counts.rented}</span><span class="label">ปิดแล้ว</span></div>
    `;
  } catch (e) {
    document.getElementById('statsBar').innerHTML = '<div class="stat-card total"><span class="num">—</span><span class="label">ทั้งหมด</span></div>';
  }
}

async function loadLeads() {
  const grid = document.getElementById('leadGrid');
  const pag = document.getElementById('pagination');
  const count = document.getElementById('resultCount');

  grid.innerHTML = '<div class="loading">กำลังโหลดข้อมูล...</div>';
  pag.innerHTML = '';
  count.textContent = '';

  try {
    const params = getFilterParams();
    const res = await fetch(API_BASE + '/api/leads?' + params.toString());
    if (!res.ok) { grid.innerHTML = '<div class="empty-state">โหลดข้อมูลไม่ได้</div>'; return; }
    const data = await res.json();

    const leads = data.leads || [];
    const total = data.total || 0;
    const page = data.page || 1;
    const totalPages = data.totalPages || 0;

    count.textContent = `แสดง ${leads.length} จาก ${total} รายการ`;

    if (leads.length === 0) {
      grid.innerHTML = '<div class="empty-state"><i data-lucide="inbox" style="width:32px;height:32px;color:var(--color-text-muted);margin-bottom:var(--space-2);display:block;margin-left:auto;margin-right:auto"></i>ไม่พบข้อมูล — ไปที่ Config Page เพื่อรัน Collect ก่อน</div>';
      lucide.createIcons();
      return;
    }

    let html = '';
    for (const l of leads) {
      html += renderLeadCard(l);
    }
    grid.innerHTML = html;

    renderPagination(page, totalPages);
    lucide.createIcons();
  } catch (err) {
    grid.innerHTML = '<div class="empty-state">Error: ' + err.message + '</div>';
  }
}

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtPrice(v) {
  if (v === null || v === undefined) return '';
  const n = Number(v);
  if (n >= 1e6) return (n / 1e6).toFixed(n % 1e6 === 0 ? 0 : 1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(n % 1e3 === 0 ? 0 : 0) + 'K';
  return String(n);
}

function fmtPriceFull(v) {
  if (v === null || v === undefined) return '';
  return Number(v).toLocaleString('th-TH');
}

function statusBadge(s) {
  const label = STATUS_MAP[s] || s || 'new';
  const cls = 'badge badge-' + (s || 'new');
  return `<span class="${cls}">${esc(label)}</span>`;
}

function renderLeadCard(l) {
  const thumbUrl = l.image_urls && l.image_urls.length > 0 ? l.image_urls[0] : null;
  const thumb = thumbUrl
    ? `<img src="${esc(thumbUrl)}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<span class=\\'no-img\\'><i data-lucide=\\'image-off\\' style=\\'width:20px;height:20px\\'></i></span>'" />`
    : `<span class="no-img"><i data-lucide="image-off" style="width:20px;height:20px"></i></span>`;

  const type = l.property_type ? `<span class="lead-type">${esc(l.property_type)}</span>` : '';

  let priceHtml = '';
  if (l.sale_price) {
    priceHtml = `<span class="lead-price"><i data-lucide="tag"></i> ขาย ${fmtPriceFull(l.sale_price)} บาท</span>`;
  } else if (l.rent_price) {
    priceHtml = `<span class="lead-price"><i data-lucide="tag"></i> เช่า ${fmtPriceFull(l.rent_price)} บาท/ด.</span>`;
  }

  const loc = [];
  if (l.province) loc.push(l.province);
  if (l.district) loc.push(l.district);
  const locHtml = loc.length
    ? `<div class="lead-location"><i data-lucide="map-pin" style="width:12px;height:12px"></i> ${loc.map(esc).join(' / ')}</div>`
    : '';

  const contact = [];
  if (l.phone_number) contact.push(`<a href="tel:${esc(l.phone_number)}"><i data-lucide="phone" style="width:12px;height:12px"></i> ${esc(l.phone_number)}</a>`);
  if (l.line_id) contact.push(`<span><i data-lucide="message-circle" style="width:12px;height:12px"></i> LINE: ${esc(l.line_id)}</span>`);
  const contactHtml = contact.length
    ? `<div class="lead-contact">${contact.join('')}</div>`
    : '';

  const conf = l.confidence_score !== null && l.confidence_score !== undefined ? Math.round(l.confidence_score * 100) : 0;
  const confClass = conf >= 70 ? 'high' : conf >= 40 ? 'med' : 'low';
  const status = statusBadge(l.lead_status);

  const dateHtml = l.posted_at
    ? `<span class="lead-date"><i data-lucide="calendar" style="width:12px;height:12px"></i> ${new Date(l.posted_at).toLocaleDateString('th-TH')}</span>`
    : '';

  const areaHtml = [];
  if (l.land_area) areaHtml.push(esc(l.land_area));
  if (l.building_area) areaHtml.push(esc(l.building_area));
  const areaStr = areaHtml.length ? areaHtml.join(' | ') : '';

  const id = esc(l.id);

  return `<div class="lead-card">
    <div class="lead-card-inner">
      <div class="lead-thumb">${thumb}</div>
      <div class="lead-body">
        <div class="lead-head">${type} ${status}</div>
        ${priceHtml}
        ${locHtml}
        ${contactHtml}
        ${areaStr ? `<div style="font-size:0.78rem;color:var(--color-text-muted)">${areaStr}</div>` : ''}
        <div class="lead-conf">
          <div class="conf-bar"><div class="conf-bar-fill ${confClass}" style="width:${conf}%"></div></div>
          <span class="conf-text">${conf}%</span>
        </div>
        <div class="lead-footer">
          ${dateHtml}
          <div class="lead-actions">
            <button class="btn btn-xs btn-ghost" onclick="shareLead('${id}')" title="แชร์"><i data-lucide="share-2" style="width:14px;height:14px"></i> แชร์</button>
            <button class="btn btn-xs btn-ghost" onclick="detailLead('${id}')" title="ดูรายละเอียด"><i data-lucide="eye" style="width:14px;height:14px"></i> ดู</button>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function renderPagination(page, totalPages) {
  const pag = document.getElementById('pagination');
  if (totalPages <= 1) { pag.innerHTML = ''; return; }
  let html = '';
  html += `<button class="page-btn" onclick="goPage(${page - 1})" ${page <= 1 ? 'disabled' : ''}><i data-lucide="chevron-left" style="width:16px;height:16px"></i></button>`;

  const range = 2;
  const start = Math.max(1, page - range);
  const end = Math.min(totalPages, page + range);

  if (start > 1) {
    html += `<button class="page-btn" onclick="goPage(1)">1</button>`;
    if (start > 2) html += `<span style="color:var(--color-text-muted);padding:0 var(--space-1)">...</span>`;
  }
  for (let i = start; i <= end; i++) {
    html += `<button class="page-btn ${i === page ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
  }
  if (end < totalPages) {
    if (end < totalPages - 1) html += `<span style="color:var(--color-text-muted);padding:0 var(--space-1)">...</span>`;
    html += `<button class="page-btn" onclick="goPage(${totalPages})">${totalPages}</button>`;
  }

  html += `<button class="page-btn" onclick="goPage(${page + 1})" ${page >= totalPages ? 'disabled' : ''}><i data-lucide="chevron-right" style="width:16px;height:16px"></i></button>`;
  pag.innerHTML = html;
  lucide.createIcons();
}

function goPage(p) {
  currentState.page = p;
  loadLeads();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ─── Share ────────────────────────────────────
function shareLead(id) {
  fetch(API_BASE + '/api/leads/' + id)
    .then(r => r.json())
    .then(l => {
      const lines = [];
      lines.push(`📌 ${l.property_type || 'ประกาศ'}${l.listing_status === 'rent' ? ' ให้เช่า' : l.listing_status === 'sale' ? ' ขาย' : ''}`);
      if (l.sale_price) lines.push(`💰 ขาย ${fmtPriceFull(l.sale_price)} บาท`);
      if (l.rent_price) lines.push(`💰 เช่า ${fmtPriceFull(l.rent_price)} บาท/เดือน`);
      if (l.land_area) lines.push(`📐 เนื้อที่ ${l.land_area}`);
      if (l.building_area) lines.push(`📐 พื้นที่ใช้สอย ${l.building_area}`);
      const loc = [l.province, l.district, l.sub_district].filter(Boolean).join(' / ');
      if (loc) lines.push(`📍 ${loc}`);
      if (l.contact_name) lines.push(`👤 ${l.contact_name}`);
      const contacts = [];
      if (l.phone_number) contacts.push(`📞 ${l.phone_number}`);
      if (l.line_id) contacts.push(`LINE: ${l.line_id}`);
      if (l.whatsapp) contacts.push(`WA: ${l.whatsapp}`);
      if (contacts.length) lines.push(contacts.join(' | '));
      if (l.owner_or_agent) lines.push(`🏢 ${l.owner_or_agent === 'owner' ? 'เจ้าของ' : l.owner_or_agent === 'agent' ? 'ตัวแทน' : ''}`);
      if (l.ai_summary) lines.push(`💬 ${l.ai_summary}`);
      lines.push('');
      lines.push(`🔗 ${l.post_url || ''}`);
      lines.push('———');
      lines.push('ดึงข้อมูลโดย FindProperty Lead Intelligence');

      document.getElementById('shareText').value = lines.join('\n');
      document.getElementById('copyBtn').className = 'copy-btn';
      document.getElementById('copyBtn').innerHTML = '<i data-lucide="copy" style="width:16px;height:16px"></i> คัดลอกข้อความ';
      document.getElementById('shareModal').classList.add('show');
      lucide.createIcons();
    })
    .catch(e => showToast('Error: ' + e.message));
}

function closeShareModal() {
  document.getElementById('shareModal').classList.remove('show');
}

function copyShareText() {
  const text = document.getElementById('shareText');
  text.select();
  navigator.clipboard.writeText(text.value).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.className = 'copy-btn copied';
    btn.innerHTML = '<i data-lucide="check" style="width:16px;height:16px"></i> คัดลอกแล้ว';
    lucide.createIcons();
    showToast('คัดลอกข้อความแล้ว');
  }).catch(() => {
    showToast('ไม่สามารถคัดลอกได้');
  });
}

// ─── Detail ───────────────────────────────────
function detailLead(id) {
  fetch(API_BASE + '/api/leads/' + id)
    .then(r => r.json())
    .then(l => {
      document.getElementById('detailTitle').textContent = `📋 ${l.property_type || 'ประกาศ'} #${l.id.slice(0, 8)}`;
      let html = '';

      // Property info
      html += '<div class="detail-section"><h3>ข้อมูลประกาศ</h3>';
      html += row('ประเภท', l.property_type);
      html += row('สถานะ', STATUS_MAP[l.listing_status] || l.listing_status);
      html += row('ราคาขาย', l.sale_price ? `${fmtPriceFull(l.sale_price)} บาท` : '');
      html += row('ค่าเช่า', l.rent_price ? `${fmtPriceFull(l.rent_price)} บาท/ด.` : '');
      html += row('เนื้อที่', l.land_area);
      html += row('พื้นที่ใช้สอย', l.building_area);
      html += row('ที่อยู่', [l.address, l.sub_district, l.district, l.province].filter(Boolean).join(' '));
      html += row('Link โพสต์', l.post_url ? `<a href="${esc(l.post_url)}" target="_blank">เปิดโพสต์</a>` : '');
      html += row('แหล่ง', l.source_url);
      html += '</div>';

      // Contact
      html += '<div class="detail-section"><h3>ข้อมูลติดต่อ</h3>';
      html += row('ชื่อ', l.contact_name);
      html += row('เบอร์', l.phone_number ? `<a href="tel:${esc(l.phone_number)}">${esc(l.phone_number)}</a>` : '');
      html += row('LINE', l.line_id);
      html += row('WhatsApp', l.whatsapp);
      html += row('WeChat', l.wechat);
      html += row('ประเภท', l.owner_or_agent === 'owner' ? 'เจ้าของ' : l.owner_or_agent === 'agent' ? 'ตัวแทน' : l.owner_or_agent);
      html += '</div>';

      // AI
      html += '<div class="detail-section"><h3>AI วิเคราะห์</h3>';
      html += row('สรุป', l.ai_summary);
      html += row('ความมั่นใจ', l.confidence_score !== null ? `${(l.confidence_score * 100).toFixed(1)}%` : '');
      html += row('แท็ก', l.ai_tags ? l.ai_tags.join(', ') : '');
      html += '</div>';

      // Internal
      html += '<div class="detail-section"><h3>สถานะภายใน</h3>';
      html += row('สถานะ Lead', STATUS_MAP[l.lead_status] || l.lead_status);
      html += row('หมายเหตุ', l.notes);
      html += row('ผู้รับผิดชอบ', l.assigned_to);
      html += row('วันที่โพสต์', l.posted_at ? new Date(l.posted_at).toLocaleString('th-TH') : '');
      html += row('วันที่เก็บ', l.collected_at ? new Date(l.collected_at).toLocaleString('th-TH') : '');
      html += '</div>';

      // Images
      if (l.image_urls && l.image_urls.length > 0) {
        html += '<div class="detail-section"><h3>รูปภาพ</h3><div class="detail-imgs">';
        for (const url of l.image_urls) {
          html += `<img src="${esc(url)}" alt="" onclick="window.open('${esc(url)}','_blank')" />`;
        }
        html += '</div></div>';
      }

      document.getElementById('detailBody').innerHTML = html;
      document.getElementById('detailModal').classList.add('show');
      lucide.createIcons();
    })
    .catch(e => showToast('Error: ' + e.message));
}

function closeDetailModal() {
  document.getElementById('detailModal').classList.remove('show');
}

function row(label, value) {
  if (!value) return '';
  return `<div class="detail-row"><span class="lbl">${esc(label)}</span><span class="val">${value}</span></div>`;
}

// ─── Export ────────────────────────────────────
function exportCSV() {
  const params = getFilterParams();
  params.delete('page');
  params.delete('limit');
  const url = API_BASE + '/api/leads/export?' + params.toString();
  window.open(url, '_blank');
  showToast('กำลังดาวน์โหลด CSV...');
}

// Click outside modal to close
document.addEventListener('click', function (e) {
  if (e.target.classList.contains('modal-overlay')) {
    e.target.classList.remove('show');
  }
});
