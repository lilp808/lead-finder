<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FindProperty — Leads</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root {
  --font-family: 'Poppins', sans-serif;
  --color-primary: #D4A843;
  --color-primary-hover: #C8992F;
  --color-primary-bg: #F8F3E8;
  --color-bg: #FAFAFA;
  --color-surface: #FFFFFF;
  --color-text: #2F2F2F;
  --color-text-secondary: #707070;
  --color-text-muted: #A5A5A5;
  --color-border: #ECECEC;
  --color-border-light: #F3F3F3;
  --color-success: #30C46C;
  --color-info: #4E9EF7;
  --color-warning: #E7B64A;
  --color-danger: #E15D5D;
  --color-price: #D1453B;
  --color-success-bg: #ECFAF2;
  --color-info-bg: #EDF5FF;
  --color-warning-bg: #FFF7E8;
  --radius-sm: 8px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 20px;
  --radius-full: 999px;
  --shadow-sm: 0 2px 10px rgba(0,0,0,.04);
  --shadow-md: 0 6px 20px rgba(0,0,0,.05);
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px;
  --transition: 200ms ease;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body { font-family: var(--font-family); background: var(--color-bg); color: var(--color-text); padding: var(--space-5) var(--space-6); max-width: 1200px; margin: 0 auto; }

.nav { display: flex; gap: var(--space-1); margin-bottom: var(--space-5); border-bottom: 2px solid var(--color-border); padding-bottom: 0; }
.nav a {
  display: inline-flex; align-items: center; gap: var(--space-2);
  padding: var(--space-3) var(--space-5);
  text-decoration: none; font-weight: 500; font-size: 0.9rem;
  color: var(--color-text-secondary);
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: all var(--transition);
}
.nav a.active { color: var(--color-primary); border-bottom-color: var(--color-primary); }
.nav a:hover:not(.active) { color: var(--color-text); }

.page-title { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-6); }
.page-title span { color: var(--color-primary); }

.stats { display: flex; gap: var(--space-4); flex-wrap: wrap; margin-bottom: var(--space-6); }
.stat-card {
  flex: 1; min-width: 100px;
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-md); padding: var(--space-3) var(--space-4);
  text-align: center; box-shadow: var(--shadow-sm);
}
.stat-card .num { font-size: 1.4rem; font-weight: 700; display: block; }
.stat-card .label { font-size: 0.72rem; color: var(--color-text-secondary); }
.stat-card.total .num { color: var(--color-text); }
.stat-card.new .num { color: var(--color-info); }
.stat-card.contacted .num { color: var(--color-warning); }
.stat-card.appointment .num { color: var(--color-success); }
.stat-card.sold .num { color: var(--color-danger); }

.filters {
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-lg); padding: var(--space-4) var(--space-5);
  margin-bottom: var(--space-5); box-shadow: var(--shadow-sm);
}
.filter-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr; gap: var(--space-3); align-items: end; }
.filter-grid .field { display: flex; flex-direction: column; gap: var(--space-1); }
.filter-grid .field label { font-size: 0.72rem; font-weight: 500; color: var(--color-text-secondary); }
.filter-actions { display: flex; gap: var(--space-2); align-items: flex-end; }
.filter-toggle {
  display: none; width: 100%; padding: var(--space-2);
  background: none; border: 1px dashed var(--color-border);
  border-radius: var(--radius-sm); cursor: pointer;
  font-family: var(--font-family); font-size: 0.82rem;
  color: var(--color-text-secondary); margin-bottom: var(--space-3); text-align: center;
}
.filter-toggle:hover { background: var(--color-bg); }

.actions-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--space-3); margin-bottom: var(--space-4); }
.actions-bar .left { display: flex; align-items: center; gap: var(--space-3); }
.actions-bar .right { display: flex; gap: var(--space-2); }
.result-count { font-size: 0.85rem; color: var(--color-text-secondary); }

.lead-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); margin-bottom: var(--space-6); }

.lead-card {
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-lg); overflow: hidden;
  box-shadow: var(--shadow-sm); transition: box-shadow var(--transition);
  display: flex; flex-direction: column;
}
.lead-card:hover { box-shadow: var(--shadow-md); }

.lead-card-inner { display: flex; flex: 1; }
.lead-thumb {
  width: 160px; min-height: 150px; flex-shrink: 0;
  background: var(--color-border-light);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; position: relative;
}
.lead-thumb img { width: 100%; height: 100%; object-fit: cover; }
.lead-thumb .no-img { color: var(--color-text-muted); display: flex; flex-direction: column; align-items: center; gap: var(--space-1); font-size: 0.72rem; }

.lead-body {
  flex: 1; padding: var(--space-4) var(--space-4) var(--space-3);
  display: flex; flex-direction: column; gap: var(--space-1);
  min-width: 0;
}

.lead-head { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-1); }
.lead-type { font-size: 0.78rem; font-weight: 600; color: var(--color-primary); background: var(--color-primary-bg); padding: 2px 10px; border-radius: var(--radius-full); }

.lead-price {
  font-size: 1.2rem; font-weight: 700; color: var(--color-price);
  display: flex; align-items: center; gap: var(--space-2);
  margin-bottom: var(--space-1);
}
.lead-price .label { font-size: 0.78rem; font-weight: 500; color: var(--color-text-secondary); background: var(--color-border-light); padding: 1px 8px; border-radius: var(--radius-full); }

.lead-detail { font-size: 0.82rem; color: var(--color-text-secondary); display: flex; align-items: center; gap: var(--space-1); }

.lead-meta {
  display: flex; align-items: center; gap: var(--space-3);
  flex-wrap: wrap; font-size: 0.82rem;
  margin-top: var(--space-1);
}
.lead-meta a { color: var(--color-info); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.lead-meta a:hover { text-decoration: underline; }
.lead-meta .sep { color: var(--color-border); }

.lead-area { font-size: 0.78rem; color: var(--color-text-muted); display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }

.lead-footer {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: var(--space-2);
  margin-top: auto; padding-top: var(--space-2);
  border-top: 1px solid var(--color-border-light);
}
.lead-footer-left { display: flex; align-items: center; gap: var(--space-2); }
.lead-date { font-size: 0.72rem; color: var(--color-text-muted); display: flex; align-items: center; gap: 4px; }
.lead-actions { display: flex; gap: var(--space-1); }

.conf-bar-wrap { display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-1); }
.conf-bar { flex: 1; max-width: 120px; height: 5px; background: var(--color-border-light); border-radius: var(--radius-full); overflow: hidden; }
.conf-bar-fill { height: 100%; border-radius: var(--radius-full); transition: width 0.3s; }
.conf-bar-fill.high { background: var(--color-success); }
.conf-bar-fill.med { background: var(--color-warning); }
.conf-bar-fill.low { background: var(--color-danger); }
.conf-text { font-size: 0.7rem; color: var(--color-text-muted); white-space: nowrap; }

.badge {
  display: inline-flex; align-items: center; gap: var(--space-1);
  padding: 2px 10px; border-radius: var(--radius-full);
  font-size: 0.7rem; font-weight: 600; line-height: 1.5;
}
.badge-new { background: var(--color-info-bg); color: var(--color-info); }
.badge-contacted { background: var(--color-warning-bg); color: #92400e; }
.badge-interested { background: var(--color-success-bg); color: var(--color-success); }
.badge-not_interested { background: #FEF2F2; color: var(--color-danger); }
.badge-appointment { background: #E8F5E9; color: #2E7D32; }
.badge-sold { background: #FCE4EC; color: #C62828; }
.badge-rented { background: #E0F7FA; color: #00695C; }
.badge-invalid { background: #F5F5F5; color: #9E9E9E; }
.badge-fb { background: #E8F0FE; color: #1877F2; }
.badge-dd { background: #FFF4E5; color: #B45309; }
.badge-team-a { background: #E8F0FE; color: #1565C0; }
.badge-team-b { background: #E8F5E9; color: #2E7D32; }
.badge-team-c { background: #FFF4E5; color: #B45309; }
.badge-team-none { background: #F5F5F5; color: #9E9E9E; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  height: 38px; padding: 0 var(--space-4); border-radius: var(--radius-md);
  font-family: var(--font-family); font-size: 0.85rem; font-weight: 600;
  border: 1px solid transparent; cursor: pointer;
  transition: all var(--transition); white-space: nowrap; text-decoration: none; line-height: 1;
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--color-primary); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--color-primary-hover); }
.btn-secondary { background: var(--color-surface); color: var(--color-text-secondary); border-color: var(--color-border); }
.btn-secondary:hover:not(:disabled) { background: #FAFAFA; color: var(--color-text); }
.btn-ghost { background: transparent; color: var(--color-text-secondary); padding: 0 var(--space-2); height: 34px; }
.btn-ghost:hover:not(:disabled) { background: #F5F5F5; }
.btn-sm { height: 34px; padding: 0 var(--space-3); font-size: 0.82rem; }
.btn-xs { height: 28px; padding: 0 var(--space-2); font-size: 0.75rem; }

.input {
  height: 38px; padding: 0 var(--space-3); border: 1px solid var(--color-border);
  border-radius: var(--radius-md); font-family: var(--font-family); font-size: 0.82rem;
  color: var(--color-text); background: var(--color-surface);
  transition: all var(--transition); outline: none; width: 100%;
}
.input:focus { border-color: var(--color-primary); box-shadow: 0 0 0 4px rgba(212,168,67,.15); }
.input::placeholder { color: var(--color-text-muted); }
select.input { cursor: pointer; }

.pagination { display: flex; align-items: center; justify-content: center; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-8); }
.page-btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 36px; height: 36px; border: 1px solid var(--color-border);
  border-radius: var(--radius-md); background: var(--color-surface);
  font-family: var(--font-family); font-size: 0.82rem; font-weight: 500;
  color: var(--color-text-secondary); cursor: pointer;
  transition: all var(--transition);
}
.page-btn:hover:not(.active):not(:disabled) { background: var(--color-bg); }
.page-btn.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
.page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.4); z-index: 1000;
  align-items: center; justify-content: center; padding: var(--space-4);
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--color-surface); border-radius: var(--radius-xl);
  max-width: 560px; width: 100%; max-height: 80vh; overflow-y: auto;
  padding: var(--space-6); box-shadow: 0 20px 60px rgba(0,0,0,.15);
  position: relative;
}
.modal-close { position: absolute; top: var(--space-3); right: var(--space-3); background: none; border: none; cursor: pointer; color: var(--color-text-muted); padding: var(--space-1); border-radius: var(--radius-sm); }
.modal-close:hover { background: var(--color-bg); color: var(--color-text); }
.modal h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: var(--space-4); }
.modal textarea {
  width: 100%; min-height: 160px;
  border: 1px solid var(--color-border); border-radius: var(--radius-md);
  padding: var(--space-3); font-family: var(--font-family); font-size: 0.85rem;
  color: var(--color-text); resize: vertical; outline: none;
}
.modal textarea:focus { border-color: var(--color-primary); }
.modal-wide { max-width: 720px; }

.modal-tabs { display: flex; gap: var(--space-2); margin-bottom: var(--space-4); border-bottom: 1px solid var(--color-border); }
.modal-tab {
  display: inline-flex; align-items: center; gap: var(--space-2);
  padding: var(--space-2) var(--space-4); background: none; border: none;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  font-family: var(--font-family); font-size: 0.85rem; font-weight: 600;
  color: var(--color-text-muted); cursor: pointer; transition: color var(--transition);
}
.modal-tab:hover { color: var(--color-text); }
.modal-tab.active { color: var(--color-primary); border-bottom-color: var(--color-primary); }
.modal-pane.hidden { display: none; }

.slider { position: relative; border-radius: var(--radius-lg); overflow: hidden; background: #000; margin-bottom: var(--space-4); }
.slider-viewport { overflow: hidden; }
.slider-track { display: flex; transition: transform 250ms ease; }
.slider-track img { width: 100%; flex-shrink: 0; max-height: 420px; object-fit: contain; background: #000; display: block; }
.slider-btn {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 34px; height: 34px; border-radius: var(--radius-full);
  border: none; background: rgba(255,255,255,.85); color: var(--color-text);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,.2); font-size: 1rem; line-height: 1;
}
.slider-btn:hover { background: #fff; }
.slider-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.slider-prev { left: var(--space-3); }
.slider-next { right: var(--space-3); }
.slider-count {
  position: absolute; bottom: var(--space-3); left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,.55); color: #fff; font-size: 0.78rem; font-weight: 600;
  padding: 2px 10px; border-radius: var(--radius-full);
}
.slider-empty { display: flex; flex-direction: column; align-items: center; gap: var(--space-2); padding: var(--space-10); color: var(--color-text-muted); }

.post-text {
  background: var(--color-bg); border: 1px solid var(--color-border);
  border-radius: var(--radius-md); padding: var(--space-4);
  font-size: 0.85rem; line-height: 1.6; color: var(--color-text);
  white-space: pre-wrap; word-break: break-word;
  max-height: 240px; overflow-y: auto; margin-bottom: var(--space-4);
}
.post-actions { display: flex; gap: var(--space-2); }
.copy-btn {
  display: inline-flex; align-items: center; gap: var(--space-2);
  margin-top: var(--space-3); padding: var(--space-2) var(--space-4);
  border-radius: var(--radius-md); background: var(--color-primary); color: #fff;
  border: none; font-family: var(--font-family); font-size: 0.85rem; font-weight: 600;
  cursor: pointer; transition: background var(--transition);
}
.copy-btn:hover { background: var(--color-primary-hover); }
.copy-btn.copied { background: var(--color-success); }

.detail-section { margin-bottom: var(--space-4); }
.detail-section h3 { font-size: 0.85rem; font-weight: 600; color: var(--color-primary); margin-bottom: var(--space-2); text-transform: uppercase; letter-spacing: 0.5px; }
.detail-row { display: flex; gap: var(--space-2); padding: 3px 0; font-size: 0.85rem; }
.detail-row .lbl { color: var(--color-text-secondary); min-width: 90px; flex-shrink: 0; }
.detail-row .val { color: var(--color-text); word-break: break-all; }
.detail-imgs { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.detail-imgs img { width: 100px; height: 75px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--color-border); cursor: pointer; }

.toast { position: fixed; bottom: var(--space-6); left: 50%; transform: translateX(-50%); background: var(--color-text); color: #fff; padding: var(--space-3) var(--space-6); border-radius: var(--radius-full); font-size: 0.85rem; font-weight: 500; z-index: 2000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.toast.show { opacity: 1; }

.empty-state { text-align: center; padding: var(--space-10) var(--space-4); color: var(--color-text-muted); font-size: 0.9rem; }
.loading { color: var(--color-text-muted); font-size: 0.85rem; padding: var(--space-8) 0; text-align: center; }

@media (max-width: 900px) {
  .lead-grid { grid-template-columns: 1fr; }
  .filter-grid { grid-template-columns: 1fr 1fr; }
  .filter-grid .filter-actions { grid-column: 1 / -1; }
  .filter-toggle { display: block; }
  .filter-grid.collapsed { display: none; }
}
@media (max-width: 600px) {
  body { padding: var(--space-3); }
  .filter-grid { grid-template-columns: 1fr; }
  .lead-thumb { width: 100px; min-height: 110px; }
  .stats { gap: var(--space-2); }
  .stat-card { min-width: 70px; padding: var(--space-2); }
  .stat-card .num { font-size: 1.1rem; }
  .actions-bar .left, .actions-bar .right { width: 100%; }
  .actions-bar { flex-direction: column; align-items: stretch; }
  .lead-price { font-size: 1rem; }
  .lead-meta { gap: var(--space-2); }
}
</style>
</head>
<body>

<div class="nav">
  <a href="/"><i data-lucide="settings-2" style="width:16px;height:16px"></i> Config</a>
  <a href="/lead" class="active"><i data-lucide="users" style="width:16px;height:16px"></i> Leads</a>
  <a href="/logs"><i data-lucide="scroll-text" style="width:16px;height:16px"></i> Logs</a>
</div>

<h1 class="page-title">
  <i data-lucide="users" style="width:24px;height:24px;color:var(--color-primary)"></i>
  Find<span>Property</span> — Leads
</h1>

<div class="stats" id="statsBar"><div class="loading">Loading stats...</div></div>

<div class="filters">
  <button class="filter-toggle" id="filterToggle" onclick="toggleFilters()">
    <i data-lucide="sliders-horizontal" style="width:14px;height:14px"></i> Filters
  </button>
  <div class="filter-grid" id="filterGrid">
    <div class="field">
      <label>Search</label>
      <input class="input" type="text" id="fSearch" placeholder="Name, post text, phone, LINE..." />
    </div>
    <div class="field">
      <label>Status</label>
      <select class="input" id="fStatus">
        <option value="">All</option>
        <option value="new">New</option>
        <option value="contacted">Contacted</option>
        <option value="interested">Interested</option>
        <option value="not_interested">Not Interested</option>
        <option value="appointment">Appointment</option>
        <option value="sold">Sold</option>
        <option value="rented">Rented</option>
        <option value="invalid">Invalid</option>
      </select>
    </div>
    <div class="field">
      <label>Type</label>
      <select class="input" id="fType">
        <option value="">All</option>
        <option value="Warehouse">Warehouse</option>
        <option value="Factory">Factory</option>
        <option value="Showroom & Commercial">Showroom & Commercial</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div class="field">
      <label>Source</label>
      <select class="input" id="fPlatform">
        <option value="">All</option>
        <option value="facebook">Facebook</option>
        <option value="ddproperty">DDProperty</option>
      </select>
    </div>
    <div class="field">
      <label>Source Config</label>
      <select class="input" id="fSourceName">
        <option value="">All</option>
      </select>
    </div>
    <div class="field">
      <label>Agent Team</label>
      <select class="input" id="fAgentTeam">
        <option value="">All</option>
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="unassigned">Unassigned</option>
      </select>
    </div>
    <div class="field">
      <label>Province</label>
      <input class="input" type="text" id="fProvince" placeholder="e.g. Bangkok" />
    </div>
    <div class="field filter-actions" style="align-items:flex-end">
      <button class="btn btn-primary btn-sm" onclick="applyFilters()"><i data-lucide="search" style="width:14px;height:14px"></i> Search</button>
      <button class="btn btn-secondary btn-sm" onclick="resetFilters()"><i data-lucide="x" style="width:14px;height:14px"></i> Clear</button>
    </div>
  </div>
</div>

<div class="actions-bar">
  <div class="left">
    <span class="result-count" id="resultCount"></span>
  </div>
  <div class="right">
    <button class="btn btn-secondary btn-sm" onclick="exportCSV()">
      <i data-lucide="download" style="width:14px;height:14px"></i> Export CSV
    </button>
  </div>
</div>

<div id="leadGrid"><div class="loading">Loading leads...</div></div>

<div class="pagination" id="pagination"></div>

<div class="modal-overlay" id="shareModal">
  <div class="modal">
    <button class="modal-close" onclick="closeShareModal()"><i data-lucide="x" style="width:20px;height:20px"></i></button>
    <h2><i data-lucide="share-2" style="width:18px;height:18px;vertical-align:middle"></i> Share Listing</h2>
    <textarea id="shareText" readonly></textarea>
    <button class="copy-btn" id="copyBtn" onclick="copyShareText()">
      <i data-lucide="copy" style="width:16px;height:16px"></i> Copy Text
    </button>
  </div>
</div>

<div class="modal-overlay" id="detailModal">
  <div class="modal modal-wide">
    <button class="modal-close" onclick="closeDetailModal()"><i data-lucide="x" style="width:20px;height:20px"></i></button>
    <h2 id="detailTitle">Details</h2>
    <div class="modal-tabs">
      <button class="modal-tab active" id="tabPost" onclick="switchModalView('post')"><i data-lucide="file-text" style="width:14px;height:14px"></i> Original Post</button>
      <button class="modal-tab" id="tabDetail" onclick="switchModalView('detail')"><i data-lucide="info" style="width:14px;height:14px"></i> Details</button>
    </div>
    <div class="modal-pane" id="postPane"></div>
    <div class="modal-pane hidden" id="detailPane"><div id="detailBody"></div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE = '';

const STATUS_MAP = {
  new: 'New', contacted: 'Contacted', interested: 'Interested',
  not_interested: 'Not Interested', appointment: 'Appointment',
  sold: 'Sold', rented: 'Rented', invalid: 'Invalid',
};

const PLATFORM_MAP = { facebook: 'Facebook', ddproperty: 'DDProperty' };

const TYPE_LABEL_MAP = {
  warehouse: 'Warehouse',
  factory: 'Factory',
  warehouse_factory: 'Warehouse/Factory',
  'showroom & commercial': 'Showroom & Commercial',
};

let currentState = { page: 1 };
let detailSliderIndex = 0;

window.onload = function () {
  lucide.createIcons();
  loadLeads();
  loadStats();
  loadSourceOptions();
};

async function loadSourceOptions() {
  try {
    const res = await fetch(API_BASE + '/api/sources');
    if (!res.ok) return;
    const data = await res.json();
    const sel = document.getElementById('fSourceName');
    const seen = new Set();
    for (const s of data || []) {
      if (!s.label || seen.has(s.label)) continue;
      seen.add(s.label);
      const opt = document.createElement('option');
      opt.value = s.label;
      opt.textContent = s.label;
      sel.appendChild(opt);
    }
  } catch (e) { /* ignore */ }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function toggleFilters() {
  const g = document.getElementById('filterGrid');
  g.classList.toggle('collapsed');
  const btn = document.getElementById('filterToggle');
  if (g.classList.contains('collapsed')) {
    btn.innerHTML = '<i data-lucide="sliders-horizontal" style="width:14px;height:14px"></i> Filters';
  } else {
    btn.innerHTML = '<i data-lucide="sliders-horizontal" style="width:14px;height:14px"></i> Hide Filters';
  }
  lucide.createIcons();
}

function getFilters() {
  return {
    search: document.getElementById('fSearch').value.trim(),
    status: document.getElementById('fStatus').value,
    property_type: document.getElementById('fType').value,
    province: document.getElementById('fProvince').value.trim(),
    source_platform: document.getElementById('fPlatform').value,
    source_name: document.getElementById('fSourceName').value,
    agent_team: document.getElementById('fAgentTeam').value,
  };
}

function getFilterParams() {
  const f = getFilters();
  const p = new URLSearchParams();
  if (f.search) p.set('search', f.search);
  if (f.status) p.set('status', f.status);
  if (f.property_type) p.set('property_type', f.property_type);
  if (f.province) p.set('province', f.province);
  if (f.source_platform) p.set('source_platform', f.source_platform);
  if (f.source_name) p.set('source_name', f.source_name);
  if (f.agent_team) p.set('agent_team', f.agent_team);
  p.set('page', String(currentState.page));
  p.set('limit', '20');
  return p;
}

function applyFilters() { currentState.page = 1; loadLeads(); }
function resetFilters() {
  document.getElementById('fSearch').value = '';
  document.getElementById('fStatus').value = '';
  document.getElementById('fType').value = '';
  document.getElementById('fProvince').value = '';
  document.getElementById('fPlatform').value = '';
  document.getElementById('fSourceName').value = '';
  document.getElementById('fAgentTeam').value = '';
  currentState.page = 1;
  loadLeads();
}

async function loadStats() {
  try {
    const res = await fetch(API_BASE + '/api/leads?limit=1000');
    const data = await res.json();
    const leads = data.leads || [];
    const counts = { new: 0, contacted: 0, appointment: 0, sold: 0, rented: 0, interested: 0, not_interested: 0, invalid: 0 };
    for (const l of leads) {
      const s = l.lead_status || 'new';
      counts[s] = (counts[s] || 0) + 1;
    }
    const total = data.total || 0;
    document.getElementById('statsBar').innerHTML = `
      <div class="stat-card total"><span class="num">${total}</span><span class="label">Total</span></div>
      <div class="stat-card new"><span class="num">${counts.new}</span><span class="label">New</span></div>
      <div class="stat-card contacted"><span class="num">${counts.contacted + counts.interested + counts.not_interested}</span><span class="label">Contacted</span></div>
      <div class="stat-card appointment"><span class="num">${counts.appointment}</span><span class="label">Appointment</span></div>
      <div class="stat-card sold"><span class="num">${counts.sold + counts.rented}</span><span class="label">Closed</span></div>
    `;
  } catch (e) {
    document.getElementById('statsBar').innerHTML = '<div class="stat-card total"><span class="num">—</span><span class="label">Total</span></div>';
  }
}

async function loadLeads() {
  const grid = document.getElementById('leadGrid');
  const pag = document.getElementById('pagination');
  const count = document.getElementById('resultCount');
  grid.innerHTML = '<div class="loading">Loading leads...</div>';
  pag.innerHTML = '';
  count.textContent = '';
  try {
    const params = getFilterParams();
    const res = await fetch(API_BASE + '/api/leads?' + params.toString());
    if (!res.ok) { grid.innerHTML = '<div class="empty-state">Failed to load</div>'; return; }
    const data = await res.json();
    const leads = data.leads || [];
    const total = data.total || 0;
    const page = data.page || 1;
    const totalPages = data.totalPages || 0;
    count.textContent = `Showing ${leads.length} of ${total} leads`;
    if (leads.length === 0) {
      grid.innerHTML = '<div class="empty-state"><i data-lucide="inbox" style="width:32px;height:32px;color:var(--color-text-muted);margin-bottom:var(--space-2);display:block;margin-left:auto;margin-right:auto"></i>No leads found — go to Config page and run Collect first</div>';
      lucide.createIcons();
      return;
    }
    let html = '';
    for (const l of leads) {
      html += renderLeadCard(l);
    }
    grid.innerHTML = html;
    renderPagination(page, totalPages);
    lucide.createIcons();
  } catch (err) {
    grid.innerHTML = '<div class="empty-state">Error: ' + err.message + '</div>';
  }
}

function esc(s) { if (!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function fmtPriceFull(v) {
  if (v === null || v === undefined) return '';
  return Number(v).toLocaleString('en-US');
}

function priceBreakdown(raw, unit, area) {
  if (unit !== 'per_sqm' || !raw || !area) return '';
  return ` <span style="color:var(--color-text-muted);font-size:0.72rem">(${fmtPriceFull(raw)} ฿/ตรม × ${fmtPriceFull(area)} ตรม)</span>`;
}

function statusBadge(s) {
  const label = STATUS_MAP[s] || s || 'New';
  const cls = 'badge badge-' + (s || 'new');
  return `<span class="${cls}">${esc(label)}</span>`;
}

function platformBadge(p) {
  const label = PLATFORM_MAP[p] || p || '';
  if (!label) return '';
  const cls = p === 'ddproperty' ? 'badge badge-dd' : 'badge badge-fb';
  return `<span class="${cls}"><i data-lucide="${p === 'ddproperty' ? 'building-2' : 'facebook'}" style="width:11px;height:11px"></i>${esc(label)}</span>`;
}

function sourceNameBadge(name) {
  if (!name) return '';
  return `<span class="badge badge-gold" title="Source config">${esc(name)}</span>`;
}

function teamBadge(t) {
  if (!t) return `<span class="badge badge-team-none" title="Needs review">No team</span>`;
  const cls = t.toUpperCase() === 'A' ? 'badge-team-a' : t.toUpperCase() === 'B' ? 'badge-team-b' : 'badge-team-c';
  return `<span class="badge ${cls}" title="Agent team">Team ${esc(t.toUpperCase())}</span>`;
}

function typeLabel(t) {
  if (!t) return '';
  return TYPE_LABEL_MAP[t] || TYPE_LABEL_MAP[String(t).toLowerCase()] || t;
}

function listingStatusLabel(s) {
  if (!s) return '';
  const map = { rent: 'For Rent', sale: 'For Sale', both: 'For Rent & For Sale' };
  return map[s] || s;
}

function ownerLabel(s) {
  if (!s) return '';
  const map = { owner: 'Owner', agent: 'Agent', unknown: 'Unknown' };
  return map[s] || s;
}

function renderLeadCard(l) {
  const thumbUrl = l.image_urls && l.image_urls.length > 0 ? l.image_urls[0] : null;
  const thumb = thumbUrl
    ? `<img src="${esc(thumbUrl)}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<span class=\\'no-img\\'><i data-lucide=\\'image-off\\' style=\\'width:20px;height:20px\\'></i><span>No img</span></span>'"/>`
    : `<span class="no-img"><i data-lucide="image-off" style="width:22px;height:22px"></i><span>No image</span></span>`;

  const typeVal = typeLabel(l.property_type);
  const typeHtml = typeVal ? `<span class="lead-type">${esc(typeVal)}</span>` : '';

  let priceHtml = '';
  if (l.sale_price) {
    priceHtml = `฿${fmtPriceFull(l.sale_price)} <span class="label">Sale</span>`;
  } else if (l.rent_price) {
    priceHtml = `฿${fmtPriceFull(l.rent_price)}/mo <span class="label">Rent</span>`;
  }
  const priceSection = priceHtml ? `<div class="lead-price">${priceHtml}</div>` : '';

  const loc = [l.province, l.district].filter(Boolean);
  const locHtml = loc.length
    ? `<div class="lead-detail"><i data-lucide="map-pin" style="width:12px;height:12px;flex-shrink:0"></i> ${loc.map(esc).join(' / ')}</div>`
    : '';

  const contacts = [];
  if (l.phone_number) contacts.push(`<a href="tel:${esc(l.phone_number)}"><i data-lucide="phone" style="width:12px;height:12px"></i>${esc(l.phone_number)}</a>`);
  if (l.line_id) contacts.push(`<span><i data-lucide="message-circle" style="width:12px;height:12px"></i>LINE: ${esc(l.line_id)}</span>`);
  if (l.contact_name) contacts.unshift(`<span>${esc(l.contact_name)}</span>`);
  const contactHtml = contacts.length
    ? `<div class="lead-meta">${contacts.join('<span class="sep">|</span>')}</div>`
    : '';

  const area = [];
  if (l.land_area) area.push(`Land ${esc(l.land_area)}`);
  if (l.building_area) area.push(`Bldg ${esc(l.building_area)}`);
  const areaHtml = area.length ? `<div class="lead-area">${area.join(' · ')}</div>` : '';

  const conf = l.confidence_score !== null && l.confidence_score !== undefined ? Math.round(l.confidence_score * 100) : 0;
  const confClass = conf >= 70 ? 'high' : conf >= 40 ? 'med' : 'low';
  const status = statusBadge(l.lead_status);

  const dateStr = l.posted_at
    ? new Date(l.posted_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
    : '';

  const id = esc(l.id);

  return `<div class="lead-card">
    <div class="lead-card-inner">
      <div class="lead-thumb">${thumb}</div>
      <div class="lead-body">
        <div class="lead-head">${typeHtml}${platformBadge(l.source_platform)}${sourceNameBadge(l.source_name)}${teamBadge(l.agent_team)}${status}</div>
        ${priceSection}
        ${locHtml}
        ${contactHtml}
        ${areaHtml}
        <div class="conf-bar-wrap">
          <div class="conf-bar"><div class="conf-bar-fill ${confClass}" style="width:${conf}%"></div></div>
          <span class="conf-text">AI ${conf}%</span>
        </div>
        <div class="lead-footer">
          <div class="lead-footer-left">
            ${dateStr ? `<span class="lead-date"><i data-lucide="calendar" style="width:11px;height:11px"></i>${dateStr}</span>` : ''}
          </div>
          <div class="lead-actions">
            <button class="btn btn-xs btn-ghost" onclick="shareLead('${id}')" title="Share"><i data-lucide="share-2" style="width:13px;height:13px"></i> Share</button>
            <button class="btn btn-xs btn-ghost" onclick="detailLead('${id}')" title="View details"><i data-lucide="eye" style="width:13px;height:13px"></i> View</button>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function renderPagination(page, totalPages) {
  const pag = document.getElementById('pagination');
  if (totalPages <= 1) { pag.innerHTML = ''; return; }
  let html = '';
  html += `<button class="page-btn" onclick="goPage(${page - 1})" ${page <= 1 ? 'disabled' : ''}><i data-lucide="chevron-left" style="width:16px;height:16px"></i></button>`;
  const range = 2;
  const start = Math.max(1, page - range);
  const end = Math.min(totalPages, page + range);
  if (start > 1) {
    html += `<button class="page-btn" onclick="goPage(1)">1</button>`;
    if (start > 2) html += `<span style="color:var(--color-text-muted);padding:0 var(--space-1)">...</span>`;
  }
  for (let i = start; i <= end; i++) {
    html += `<button class="page-btn ${i === page ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
  }
  if (end < totalPages) {
    if (end < totalPages - 1) html += `<span style="color:var(--color-text-muted);padding:0 var(--space-1)">...</span>`;
    html += `<button class="page-btn" onclick="goPage(${totalPages})">${totalPages}</button>`;
  }
  html += `<button class="page-btn" onclick="goPage(${page + 1})" ${page >= totalPages ? 'disabled' : ''}><i data-lucide="chevron-right" style="width:16px;height:16px"></i></button>`;
  pag.innerHTML = html;
  lucide.createIcons();
}

function goPage(p) {
  currentState.page = p;
  loadLeads();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function shareLead(id) {
  fetch(API_BASE + '/api/leads/' + id)
    .then(r => r.json())
    .then(l => {
      const lines = [];
      lines.push(`\uD83D\uDCCC ${l.property_type || 'Listing'}${l.listing_status ? ' ' + listingStatusLabel(l.listing_status) : ''}`);
      if (l.sale_price) lines.push(`\uD83D\uDCB0 Sale: ฿${fmtPriceFull(l.sale_price)}`);
      if (l.rent_price) lines.push(`\uD83D\uDCB0 Rent: ฿${fmtPriceFull(l.rent_price)}/mo`);
      if (l.land_area) lines.push(`\uD83D\uDCD0 Land: ${l.land_area}`);
      if (l.building_area) lines.push(`\uD83D\uDCD0 Building: ${l.building_area}`);
      const loc = [l.province, l.district, l.sub_district].filter(Boolean).join(' / ');
      if (loc) lines.push(`\uD83D\uDCCD ${loc}`);
      if (l.contact_name) lines.push(`\uD83D\uDC64 ${l.contact_name}`);
      const contacts = [];
      if (l.phone_number) contacts.push(`\uD83D\uDCDE ${l.phone_number}`);
      if (l.line_id) contacts.push(`LINE: ${l.line_id}`);
      if (l.whatsapp) contacts.push(`WA: ${l.whatsapp}`);
      if (contacts.length) lines.push(contacts.join(' | '));
      if (l.owner_or_agent) lines.push(`\uD83C\uDFE2 ${ownerLabel(l.owner_or_agent)}`);
      if (l.ai_summary) lines.push(`\uD83D\uDCAC ${l.ai_summary}`);
      lines.push('');
      lines.push(`\uD83D\uDD17 ${l.post_url || ''}`);
      lines.push('\u2014\u2014\u2014');
      lines.push('Powered by FindProperty Lead Intelligence');

      document.getElementById('shareText').value = lines.join('\n');
      document.getElementById('copyBtn').className = 'copy-btn';
      document.getElementById('copyBtn').innerHTML = '<i data-lucide="copy" style="width:16px;height:16px"></i> Copy Text';
      document.getElementById('shareModal').classList.add('show');
      lucide.createIcons();
    })
    .catch(e => showToast('Error: ' + e.message));
}

function closeShareModal() { document.getElementById('shareModal').classList.remove('show'); }

function copyShareText() {
  const text = document.getElementById('shareText');
  text.select();
  navigator.clipboard.writeText(text.value).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.className = 'copy-btn copied';
    btn.innerHTML = '<i data-lucide="check" style="width:16px;height:16px"></i> Copied!';
    lucide.createIcons();
    showToast('Copied to clipboard');
  }).catch(() => { showToast('Failed to copy'); });
}

function detailLead(id) {
  fetch(API_BASE + '/api/leads/' + id)
    .then(r => r.json())
    .then(l => {
      document.getElementById('detailTitle').textContent = `\uD83D\uDCCB ${l.property_type || 'Listing'} #${l.id.slice(0, 8)}`;
      let html = '';
      html += '<div class="detail-section"><h3>Listing Info</h3>';
      html += row('Platform', PLATFORM_MAP[l.source_platform] || l.source_platform);
      html += row('Source Config', l.source_name);
      html += row('Type', l.property_type);
      html += row('Status', listingStatusLabel(l.listing_status));
      html += row('Sale Price', l.sale_price ? `฿${fmtPriceFull(l.sale_price)}${priceBreakdown(l.sale_price_raw, l.sale_price_unit, l.pricing_area_sqm)}` : '');
      html += row('Rent', l.rent_price ? `฿${fmtPriceFull(l.rent_price)}/mo${priceBreakdown(l.rent_price_raw, l.rent_price_unit, l.pricing_area_sqm)}` : '');
      html += row('Land Area', l.land_area);
      html += row('Building Area', l.building_area);
      html += row('Address', [l.address, l.sub_district, l.district, l.province].filter(Boolean).join(' '));
      const gm = l.google_maps_url
        ? (/^https?:\/\//i.test(l.google_maps_url) ? l.google_maps_url : `https://${l.google_maps_url}`)
        : '';
      html += row('Google Maps', gm ? `<a href="${esc(gm)}" target="_blank" rel="noopener">Open map</a>` : '');
      html += row('Post Link', l.post_url ? `<a href="${esc(l.post_url)}" target="_blank">Open post</a>` : '');
      html += row('Source', l.source_url);
      html += '</div>';
      html += '<div class="detail-section"><h3>Contact</h3>';
      html += row('Name', l.contact_name);
      html += row('Phone', l.phone_number ? `<a href="tel:${esc(l.phone_number)}">${esc(l.phone_number)}</a>` : '');
      html += row('LINE', l.line_id);
      html += row('WhatsApp', l.whatsapp);
      html += row('WeChat', l.wechat);
      html += row('Type', ownerLabel(l.owner_or_agent));
      html += '</div>';
      html += '<div class="detail-section"><h3>AI Analysis</h3>';
      html += row('Summary', l.ai_summary);
      html += row('Confidence', l.confidence_score !== null ? `${(l.confidence_score * 100).toFixed(1)}%` : '');
      html += row('Tags', l.ai_tags ? l.ai_tags.join(', ') : '');
      html += '</div>';
      html += '<div class="detail-section"><h3>Internal</h3>';
      html += row('Lead Status', STATUS_MAP[l.lead_status] || l.lead_status);
      html += row('Agent Team', l.agent_team ? `Team ${l.agent_team.toUpperCase()}` : '');
      html += row('Notes', l.notes);
      html += row('Assigned To', l.assigned_to);
      html += row('Posted', l.posted_at ? new Date(l.posted_at).toLocaleString('en-US') : '');
      html += row('Collected', l.collected_at ? new Date(l.collected_at).toLocaleString('en-US') : '');
      html += '</div>';
      if (l.image_urls && l.image_urls.length > 0) {
        html += '<div class="detail-section"><h3>Images</h3><div class="detail-imgs">';
        for (const url of l.image_urls) {
          html += `<img src="${esc(url)}" alt="" onclick="window.open('${esc(url)}','_blank')" />`;
        }
        html += '</div></div>';
      }
      document.getElementById('detailBody').innerHTML = html;
      document.getElementById('postPane').innerHTML = buildPostPane(l);
      detailSliderIndex = 0;
      switchModalView('post');
      document.getElementById('detailModal').classList.add('show');
      lucide.createIcons();
    })
    .catch(e => showToast('Error: ' + e.message));
}

function buildPostPane(l) {
  const imgs = l.image_urls || [];
  let sliderHtml;
  if (imgs.length === 0) {
    sliderHtml = `<div class="slider slider-empty"><i data-lucide="image-off" style="width:28px;height:28px"></i><span>No images</span></div>`;
  } else {
    const imgsHtml = imgs.map(u => `<img src="${esc(u)}" alt="" loading="lazy" />`).join('');
    const btn = imgs.length > 1
      ? `<button class="slider-btn slider-prev" id="sliderPrev" onclick="sliderMove(-1)" disabled>&lsaquo;</button>
         <button class="slider-btn slider-next" id="sliderNext" onclick="sliderMove(1)">&rsaquo;</button>
         <div class="slider-count" id="sliderCount">1 / ${imgs.length}</div>`
      : '';
    sliderHtml = `<div class="slider">
      <div class="slider-viewport"><div class="slider-track" id="sliderTrack">${imgsHtml}</div></div>
      ${btn}
    </div>`;
  }
  const text = l.raw_post_text
    ? `<div class="post-text">${esc(l.raw_post_text)}</div>`
    : `<div class="post-text" style="color:var(--color-text-muted)">No post text</div>`;
  const openBtn = l.post_url
    ? `<a class="btn btn-primary" href="${esc(l.post_url)}" target="_blank" rel="noopener"><i data-lucide="external-link" style="width:14px;height:14px"></i> Open Original Post</a>`
    : '';
  return sliderHtml + text + (openBtn ? `<div class="post-actions">${openBtn}</div>` : '');
}

function switchModalView(view) {
  const isPost = view === 'post';
  document.getElementById('tabPost').classList.toggle('active', isPost);
  document.getElementById('tabDetail').classList.toggle('active', !isPost);
  document.getElementById('postPane').classList.toggle('hidden', !isPost);
  document.getElementById('detailPane').classList.toggle('hidden', isPost);
}

function sliderMove(dir) {
  const track = document.getElementById('sliderTrack');
  if (!track) return;
  const total = track.children.length;
  detailSliderIndex = Math.max(0, Math.min(total - 1, detailSliderIndex + dir));
  track.style.transform = `translateX(-${detailSliderIndex * 100}%)`;
  const count = document.getElementById('sliderCount');
  if (count) count.textContent = `${detailSliderIndex + 1} / ${total}`;
  const prev = document.getElementById('sliderPrev');
  const next = document.getElementById('sliderNext');
  if (prev) prev.disabled = detailSliderIndex === 0;
  if (next) next.disabled = detailSliderIndex === total - 1;
}

function closeDetailModal() { document.getElementById('detailModal').classList.remove('show'); }

function row(label, value) {
  if (!value) return '';
  return `<div class="detail-row"><span class="lbl">${esc(label)}</span><span class="val">${value}</span></div>`;
}

function exportCSV() {
  const params = getFilterParams();
  params.delete('page');
  params.delete('limit');
  const url = API_BASE + '/api/leads/export?' + params.toString();
  window.open(url, '_blank');
  showToast('Downloading CSV...');
}

document.addEventListener('click', function (e) {
  if (e.target.classList.contains('modal-overlay')) {
    e.target.classList.remove('show');
  }
});
</script>
</body>
</html>
