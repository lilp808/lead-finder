<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FindProperty — Result Leads</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root {
  --font-family: 'Poppins', sans-serif;
  --color-primary: #D4A843;
  --color-primary-hover: #C8992F;
  --color-bg: #FAFAFA;
  --color-surface: #FFFFFF;
  --color-text: #2F2F2F;
  --color-text-secondary: #707070;
  --color-text-muted: #A5A5A5;
  --color-border: #ECECEC;
  --color-success: #30C46C;
  --color-info: #4E9EF7;
  --color-warning: #E7B64A;
  --color-danger: #E15D5D;
  --radius-sm: 8px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --shadow-sm: 0 2px 10px rgba(0,0,0,.04);
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-8: 32px;
  --transition: 200ms ease;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body { font-family: var(--font-family); background: var(--color-bg); color: var(--color-text); padding: var(--space-5) var(--space-6); max-width: 1100px; margin: 0 auto; }

.nav { display: flex; gap: var(--space-1); margin-bottom: var(--space-5); border-bottom: 2px solid var(--color-border); padding-bottom: 0; }
.nav a {
  display: inline-flex; align-items: center; gap: var(--space-2);
  padding: var(--space-3) var(--space-5);
  text-decoration: none; font-weight: 500; font-size: 0.9rem;
  color: var(--color-text-secondary);
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: all var(--transition);
}
.nav a.active { color: var(--color-primary); border-bottom-color: var(--color-primary); }
.nav a:hover:not(.active) { color: var(--color-text); }

.page-title { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-6); }
.page-title span { color: var(--color-primary); }
.page-title .sub { font-size: 0.85rem; font-weight: 400; color: var(--color-text-muted); }

.toolbar { display: flex; gap: var(--space-3); margin-bottom: var(--space-5); align-items: center; flex-wrap: wrap; }
.toolbar input, .toolbar select {
  padding: 10px 14px;
  border: 1px solid var(--color-border); border-radius: var(--radius-md);
  font-family: inherit; font-size: 0.9rem; background: var(--color-surface);
}
.toolbar input#searchInput { flex: 1; min-width: 200px; }
.toolbar button {
  padding: 10px 18px; border: none; border-radius: var(--radius-md);
  background: var(--color-primary); color: #fff; font-family: inherit; font-weight: 600;
  cursor: pointer; transition: background var(--transition);
}
.toolbar button:hover { background: var(--color-primary-hover); }

.result-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--space-4); margin-bottom: var(--space-6); }
.result-card {
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-lg); overflow: hidden;
  box-shadow: var(--shadow-sm); transition: border var(--transition), box-shadow var(--transition);
  display: flex; flex-direction: column;
}
.result-card:hover { border-color: var(--color-primary); box-shadow: 0 4px 16px rgba(212,168,67,.18); }
.thumb { width: 100%; height: 170px; background: #F0F0F0; position: relative; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .no-img { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--color-text-muted); font-size: 0.8rem; }
.thumb .img-count {
  position: absolute; right: var(--space-2); bottom: var(--space-2);
  background: rgba(0,0,0,.55); color: #fff; font-size: 0.7rem;
  padding: 2px 8px; border-radius: 999px;
}
.card-body { padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); flex: 1; }
.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-2); }
.card-title { font-size: 0.95rem; font-weight: 600; line-height: 1.4; }
.team-badge {
  flex-shrink: 0; font-size: 0.7rem; font-weight: 700; padding: 3px 10px; border-radius: 999px;
  background: #F8F3E8; color: var(--color-primary);
}
.team-badge.A { background: #FDEFEF; color: var(--color-danger); }
.team-badge.B { background: #EDF5FF; color: var(--color-info); }
.team-badge.C { background: #ECFAF2; color: var(--color-success); }
.meta { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.meta-item {
  font-size: 0.78rem; padding: 3px 10px; border-radius: 999px;
  background: #F3F3F3; color: var(--color-text-secondary);
  display: inline-flex; align-items: center; gap: 4px;
}
.meta-item.price { background: #FFF7E8; color: #B07A1A; }
.meta-item.sqm { background: #EDF5FF; color: var(--color-info); }
.loc { font-size: 0.85rem; color: var(--color-text-secondary); display: flex; align-items: center; gap: var(--space-1); }
.summary { font-size: 0.8rem; color: var(--color-text-muted); line-height: 1.5; flex: 1; }
.card-foot { border-top: 1px solid var(--color-border); padding: var(--space-3) var(--space-4); display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.card-foot a { font-size: 0.78rem; color: var(--color-info); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.card-foot a:hover { text-decoration: underline; }
.card-foot .src { margin-left: auto; color: var(--color-text-muted); font-size: 0.72rem; }

.pager { display: flex; gap: var(--space-3); align-items: center; justify-content: center; }
.pager button {
  padding: 8px 16px; border: 1px solid var(--color-border); border-radius: var(--radius-md);
  background: var(--color-surface); font-family: inherit; cursor: pointer;
}
.pager button:disabled { opacity: .4; cursor: not-allowed; }
.empty { color: var(--color-text-muted); text-align: center; padding: var(--space-8) 0; }
</style>
</head>
<body>

<div class="nav">
  <a href="/"><i data-lucide="settings-2" style="width:16px;height:16px"></i> Config</a>
  <a href="/lead"><i data-lucide="users" style="width:16px;height:16px"></i> Leads</a>
  <a href="/result" class="active"><i data-lucide="badge-check" style="width:16px;height:16px"></i> Result Leads</a>
  <a href="/logs"><i data-lucide="scroll-text" style="width:16px;height:16px"></i> Logs</a>
  <a href="/logout" style="margin-left:auto;color:var(--color-danger)"><i data-lucide="log-out" style="width:16px;height:16px"></i> Logout</a>
</div>

<div class="page-title">Result Leads <span>· พร้อมส่ง Agent</span></div>

<div class="toolbar">
  <input type="text" id="searchInput" placeholder="ค้นหา address / จังหวัด / แหล่งที่มา..." />
  <select id="teamFilter">
    <option value="">ทุกทีม</option>
    <option value="A">Team A</option>
    <option value="B">Team B</option>
    <option value="C">Team C</option>
    <option value="none">ยังไม่มีทีม</option>
  </select>
  <select id="platformFilter">
    <option value="">ทุกแพลตฟอร์ม</option>
    <option value="facebook">Facebook</option>
    <option value="ddproperty">DDProperty</option>
  </select>
  <button id="btnSearch"><i data-lucide="search" style="width:14px;height:14px"></i> ค้นหา</button>
  <button id="btnRefresh"><i data-lucide="refresh-cw" style="width:14px;height:14px"></i> รีเฟรช</button>
</div>

<div class="result-grid" id="resultGrid"></div>
<div class="pager" id="pager"></div>

<script>
const API_BASE = '';
let currentState = { page: 1, search: '', agent_team: '', source_platform: '' };

window.onload = function () {
  lucide.createIcons();
  loadResults();
};

async function loadResults() {
  const grid = document.getElementById('resultGrid');
  grid.innerHTML = '<div class="empty">โหลดข้อมูล...</div>';

  const params = new URLSearchParams({ page: currentState.page, limit: 12 });
  if (currentState.search) params.set('search', currentState.search);
  if (currentState.agent_team) params.set('agent_team', currentState.agent_team);
  if (currentState.source_platform) params.set('source_platform', currentState.source_platform);

  try {
    const res = await fetch(API_BASE + '/api/result-leads?' + params.toString());
    if (!res.ok) { const e = await res.json(); throw new Error(e.error || res.statusText); }
    const data = await res.json();
    renderResults(data.results || []);
    renderPager(data);
    lucide.createIcons();
  } catch (err) {
    grid.innerHTML = '<div class="empty">Error: ' + err.message + '</div>';
  }
}

function fmtPrice(r) {
  const v = r.rent_price != null ? r.rent_price : r.sale_price;
  const prefix = r.rent_price != null ? 'เช่า' : 'ขาย';
  if (v == null) return '';
  const n = Number(v);
  const str = n >= 1000000 ? (n / 1000000).toFixed(1).replace(/\.0$/, '') + ' ล.' : n.toLocaleString();
  return prefix + ' ' + str;
}

function fmtSqm(r) {
  const v = r.pricing_area_sqm ?? r.building_area_sqm ?? r.land_area_sqm;
  return v != null ? Number(v).toLocaleString() + ' ตรม.' : '';
}

function renderResults(results) {
  const grid = document.getElementById('resultGrid');
  if (!results.length) {
    grid.innerHTML = '<div class="empty">ไม่พบรายการ</div>';
    return;
  }
  grid.innerHTML = results.map(r => {
    const img = (r.image_urls && r.image_urls.length)
      ? `<img src="${esc(r.image_urls[0])}" loading="lazy" onerror="this.parentNode.innerHTML='<div class=&quot;no-img&quot;>ไม่มีรูป</div>'"/>`
      : '<div class="no-img"><i data-lucide="image" style="width:20px;height:20px"></i></div>';
    const imgCount = r.image_urls && r.image_urls.length ? r.image_urls.length : 0;
    const price = fmtPrice(r);
    const sqm = fmtSqm(r);
    const loc = [r.province, r.district, r.sub_district].filter(Boolean).join(' › ');
    const type = r.property_type || '—';
    return `
      <div class="result-card">
        <div class="thumb">${img}${imgCount ? `<span class="img-count"><i data-lucide="image" style="width:12px;height:12px"></i> ${imgCount}</span>` : ''}</div>
        <div class="card-body">
          <div class="card-top">
            <span class="card-title">${esc(type)}</span>
            <span class="team-badge ${esc(r.agent_team || '')}">${r.agent_team ? 'Team ' + esc(r.agent_team) : '—'}</span>
          </div>
          <div class="meta">
            ${price ? `<span class="meta-item price"><i data-lucide="tag" style="width:11px;height:11px"></i> ${esc(price)}</span>` : ''}
            ${sqm ? `<span class="meta-item sqm"><i data-lucide="ruler" style="width:11px;height:11px"></i> ${esc(sqm)}</span>` : ''}
            ${r.listing_status ? `<span class="meta-item">${esc(r.listing_status)}</span>` : ''}
          </div>
          ${loc ? `<div class="loc"><i data-lucide="map-pin" style="width:13px;height:13px"></i> ${esc(loc)}</div>` : ''}
          ${r.address ? `<div class="loc">${esc(r.address)}</div>` : ''}
          <div class="summary">${esc(r.ai_summary || '')}</div>
        </div>
        <div class="card-foot">
          <a href="/lead" title="ดู lead ต้นทาง"><i data-lucide="external-link" style="width:12px;height:12px"></i> Lead</a>
          ${r.google_maps_url ? `<a href="${esc(r.google_maps_url)}" target="_blank" rel="noopener"><i data-lucide="map" style="width:12px;height:12px"></i> แผนที่</a>` : ''}
          ${r.post_url ? `<a href="${esc(r.post_url)}" target="_blank" rel="noopener"><i data-lucide="link" style="width:12px;height:12px"></i> ต้นทาง</a>` : ''}
          <span class="src">${esc(r.source_platform || '')}${r.source_name ? ' · ' + esc(r.source_name) : ''}</span>
        </div>
      </div>`;
  }).join('');
}

function renderPager(data) {
  const pager = document.getElementById('pager');
  pager.innerHTML = `
    <button ${data.page <= 1 ? 'disabled' : ''} onclick="goPage(${data.page - 1})">← Prev</button>
    <span style="font-size:.85rem;color:var(--color-text-secondary)">${data.page} / ${data.totalPages || 1} (${data.total || 0} รายการ)</span>
    <button ${data.page >= (data.totalPages || 1) ? 'disabled' : ''} onclick="goPage(${data.page + 1})">Next →</button>`;
}

function goPage(p) {
  currentState.page = p;
  loadResults();
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

document.getElementById('btnSearch').onclick = function () {
  currentState.search = document.getElementById('searchInput').value.trim();
  currentState.agent_team = document.getElementById('teamFilter').value;
  currentState.source_platform = document.getElementById('platformFilter').value;
  currentState.page = 1;
  loadResults();
};
document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('btnSearch').click();
});
document.getElementById('btnRefresh').onclick = function () { loadResults(); };
document.getElementById('searchInput').addEventListener('input', function () {
  if (!this.value.trim()) {
    currentState.search = '';
    currentState.page = 1;
    loadResults();
  }
});
</script>
</body>
</html>
